name: zxplore_app
description: A Cross Platform Mobile app for Account Creation By Zenith Staff

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.1.8+11

environment:
  sdk: ">=3.3.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  intl: ^0.19.0
  win32: ^5.5.4
  http: ^1.2.0
  retrofit: ^4.0.3
  retry: ^3.1.2
  crypto: ^3.0.3
  rxdart: ^0.27.7
  sqflite: ^2.3.1
  encrypt: ^5.0.3
  location: ^5.0.3
  equatable: ^2.0.5
  freezed: ^2.5.2
  dropdown_button2: ^2.3.9
  package_info_plus: ^5.0.1
  path_provider: ^2.1.2
  url_launcher: ^6.2.4
  cupertino_icons: ^1.0.3
  image_picker: ^1.0.7
  another_flushbar: ^1.12.30
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
dev_dependencies:

  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  custom_lint:
  flutter_lints: ^2.0.0
  retrofit_generator: ^8.0.6
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10

flutter:

  uses-material-design: true
  assets:
    - assets/zenithLogo.svg
    - assets/accountType.json
    - assets/images/logo.png
    - assets/images/zenithheader.jpg
    - assets/images/view_offline.png
    - assets/images/accept_signature.png
    - assets/images/create_account.png
    - assets/server_certificate.crt
